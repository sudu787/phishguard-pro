version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: phishguard-api:latest
    container_name: phishguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - URL_MODEL_PATH=/app/ml_pipeline/models/url_xgboost.json
      - DOM_MODEL_PATH=/app/ml_pipeline/models/dom_rf.joblib
      - OPENPHISH_FEED_URL=https://openphish.com/feed.txt
      - INTEL_CACHE_TTL=3600
      # Set your actual Chrome Extension ID after first load
      - CORS_ORIGINS=["chrome-extension://YOUR_EXTENSION_ID","http://localhost:3000"]
    volumes:
      # Mount models so you can hot-swap without rebuilding
      - ./ml_pipeline/models:/app/ml_pipeline/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - phishguard

networks:
  phishguard:
    driver: bridge
